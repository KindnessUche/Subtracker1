spring.application.name=uchekd

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/subtracker}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:david_kindness_is_a_cracked_developer_change_me_in_production}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
google.client-id=${GOOGLE_CLIENT_ID:}
google.client-secret=${GOOGLE_CLIENT_SECRET:}
google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/api/gmail/callback}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.encryption.key=${APP_ENCRYPTION_KEY:xhOec+hnnnQ/4QomO1eSxGqJRBhSE1murhiPIppsbkg=}
# DEV-ONLY SAFETY NET: StartupSecurityGuard refuses to boot with the hardcoded secrets above
# when app.env=production. Always set JWT_SECRET / APP_ENCRYPTION_KEY / APP_ENV=production
# before deploying anywhere real — see StartupSecurityGuard.java.
app.env=${APP_ENV:development}
# Cookie holding the JWT. Set true (default) in any real deployment served over HTTPS;
# only turn off for plain-http local dev if the browser rejects a Secure cookie.
app.cookie.secure=${COOKIE_SECURE:true}
google.gemini-api-key=${GEMINI_API_KEY:}
# Gemini model used for extraction. Override with GEMINI_MODEL if you want gemini-3.6-flash, etc.
google.gemini-model=${GEMINI_MODEL:gemini-2.5-flash}

# Gmail sync tuning. Each scanned email costs one Gemini call, so max-results is the main cost/coverage lever.
# window-days=400 so once-a-year (annual) subscriptions are still caught.
gmail.sync.max-results=${GMAIL_SYNC_MAX_RESULTS:50}
gmail.sync.window-days=${GMAIL_SYNC_WINDOW_DAYS:400}

# ---- Email notifications ----
# Disabled by default so the app still boots without SMTP creds configured.
# Set app.mail.enabled=true (and the SMTP settings below) to actually send reminder emails.
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@subtracker.local}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}

# ---- Subscription maintenance scheduler ----
# Days before a renewal to send the reminder email.
app.notifications.reminder-days-before=${REMINDER_DAYS_BEFORE:3}
# Cron for the daily job that rolls forward past-due billing dates and sends reminders.
app.scheduler.daily-maintenance-cron=${DAILY_MAINTENANCE_CRON:0 0 7 * * *}